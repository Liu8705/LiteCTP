name: Build LiteCTP Windows Wheel
on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Select your local Python version"
        type: choice
        required: true
        default: "3.11"
        options: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      API_VER: "6.7.13"
    steps:
      - name: Download source
        uses: actions/checkout@v6
      - name: Set LiteCTP package metadata
        run: |
          @'
          import os, re
          from pathlib import Path
          p = Path("setup.py")
          text = p.read_text(encoding="utf-8")
          old, new = 'name="ctp-python"', 'name="LiteCTP"'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError("Cannot locate the package name in setup.py.")
          repo_url = os.environ["GITHUB_SERVER_URL"].rstrip("/") + "/" + os.environ["GITHUB_REPOSITORY"]
          pattern = r"""(?m)^([ \t]*url[ \t]*=[ \t]*)(["'])(.*?)\2"""
          text, count = re.subn(pattern, lambda m: m.group(1) + repr(repo_url), text, count=1)
          if count != 1:
              raise RuntimeError("Cannot locate the project URL in setup.py.")
          p.write_text(text, encoding="utf-8")
          '@ | python -
      - name: Set up cloud build environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ctp-build
          python-version: ${{ inputs.python_version }}
          channels: conda-forge
          channel-priority: strict
      - name: Install SWIG and libiconv
        run: conda install -y --override-channels -c conda-forge swig libiconv
      - name: Install Python build tools
        run: python -m pip install --upgrade pip build delvewheel
      - name: Build wheel
        run: |
          if (-not (Test-Path "api/$env:API_VER/windows")) {
            throw "CTP Windows API directory is missing."
          }
          python -m build --wheel
      - name: Bundle runtime DLLs
        run: |
          $wheels = @(Get-ChildItem dist/*.whl)
          if ($wheels.Count -ne 1) { throw "Expected exactly one wheel." }
          $dllPath = Join-Path $env:CONDA_PREFIX "Library/bin"
          python -m delvewheel repair $wheels[0].FullName --add-path $dllPath --analyze-existing --no-mangle-all --wheel-dir wheelhouse
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: LiteCTP-windows-py${{ inputs.python_version }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
  verify:
    name: Verify wheel in a separate Python environment
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Set up Python without the build environment
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
          architecture: x64
      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: LiteCTP-windows-py${{ inputs.python_version }}
          path: wheelhouse
      - name: Install and import
        run: |
          $wheels = @(Get-ChildItem wheelhouse/*.whl)
          if ($wheels.Count -ne 1) { throw "Expected exactly one wheel." }
          python -m pip install --no-index --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -c "import ctp, ctp._ctp; from importlib.metadata import version; print('LiteCTP', version('LiteCTP'), 'import OK:', ctp.__file__)"
